services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: npa
      POSTGRES_USER: npa_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in DEV/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npa_owner -d npa"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Private S3-compatible storage for uploaded PDFs. Start with: docker compose --profile storage up
  minio:
    profiles: ["storage"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address "127.0.0.1:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:
