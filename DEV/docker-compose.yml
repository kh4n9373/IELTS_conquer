services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: npa
      POSTGRES_USER: npa_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in DEV/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npa_owner -d npa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
