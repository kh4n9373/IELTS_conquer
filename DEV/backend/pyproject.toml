[project]
name = "npa-api"
version = "0.0.0"
description = "NPA English backend"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.44.9",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "pypdf[crypto]>=7.1.1",
  "pypdfium2>=5.15.2",
  "uvicorn>=0.32",
]

[project.scripts]
npa-api = "npa_api.server:main"
npa-migrate = "npa_api.cli:migrate_command"
npa-create-admin = "npa_api.cli:create_admin_command"
npa-worker = "npa_api.ocr.worker:main"

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.44.9",
  "mypy>=1.13",
  "playwright>=1.49",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["npa_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: browser flow, needs Chrome and the web dev server"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# FastAPI declares dependencies in argument defaults; tests use assert and fixed passwords.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["npa_api", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"npa_api/testing.py" = ["S"]
# Pure-Python AES fixture builder, kept compact on purpose.
"tests/aes_pdf.py" = ["E", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["npa_api"]

[[tool.mypy.overrides]]
# pypdfium2 ships no type information.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
